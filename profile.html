<!doctype html>
<html lang="uk">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Профіль | Pizza na Wypasie CRM</title><link rel="stylesheet" href="src/styles.css" /></head>
  <body>
    <main class="content">
      <header class="page-head"><div class="page-title"><p class="eyebrow">US-003 / US-004</p><h1>Профіль користувача</h1><p>Електронна пошта і роль лише для читання, особисті дані редагуються, вихід потребує підтвердження.</p></div><a class="btn ghost" href="dashboard.html">Назад</a></header>
      <section class="grid two">
        <article class="card"><div class="card-head"><h2>Анастасія</h2><span class="avatar">AN</span></div><form class="form-stack"><div class="form-row"><div class="field"><label>ПІБ</label><input value="Анастасія Коваль" /></div><div class="field"><label>Телефон</label><input value="+48 600 000 000" /></div></div><div class="form-row"><div class="field"><label>Електронна пошта</label><input value="owner@pizza.test" readonly /></div><div class="field"><label>Роль</label><input value="адміністратор / власниця" readonly /></div></div><button class="btn primary" type="button" data-toast="Профіль збережено">Зберегти</button></form></article>
        <article class="card"><div class="card-head"><h2>Безпека</h2></div><form class="form-stack"><div class="field"><label>Поточний пароль</label><input type="password" /></div><div class="field"><label>Новий пароль</label><input type="password" /></div><button class="btn ghost" type="button" data-toast="Пароль змінено">Змінити пароль</button><button class="btn danger" type="button" data-route="index.html">Вийти</button></form></article>
      </section>
    </main>
    <div class="toast" role="status"></div><script src="src/app.js?v=local-save-1"></script>
  </body>
</html>
